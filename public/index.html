<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kocia Straż — Zgłoś kota</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1c2430;
            --paper: #f7f3ea;
            --amber: #e8a33d;
            --card: #ffffff;
            --sans: 'Inter', sans-serif;
            --serif: 'Fraunces', Georgia, serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--sans);
            background: var(--paper);
            color: var(--ink);
            margin: 0;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kontener {
            background: var(--card);
            border: 2px solid var(--ink);
            border-radius: 16px;
            padding: 2rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 6px 6px 0px var(--ink);
        }

        h1 {
            font-family: var(--serif);
            margin: 0 0 0.5rem;
            font-size: 1.8rem;
        }

        p.opis-strony {
            color: #5b6472;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .pole {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        textarea, input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--ink);
            border-radius: 8px;
            font-family: var(--sans);
            font-size: 0.95rem;
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            width: 100%;
            background: var(--amber);
            color: var(--ink);
            border: 2px solid var(--ink);
            padding: 0.9rem;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--ink);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink);
        }

        #status {
            margin-top: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="kontener">
        <h1>🐾 Kocia Straż</h1>
        <p class="opis-strony">Zrób zdjęcie znalezionemu kotu i prześlij zgłoszenie.</p>

        <form id="formularz-zgloszenia">
            <div class="pole">
                <label for="zdjecieKotka">Zdjęcie kota</label>
                <input type="file" id="zdjecieKotka" accept="image/*" capture="environment" required>
            </div>

            <div class="pole">
                <label for="opis">Opis zgłoszenia</label>
                <textarea id="opis" placeholder="Opisz stan kota, znak szczególny lub dokładne miejsce..."></textarea>
            </div>

            <button type="submit" id="btn-wyslij">Wyoślij zgłoszenie</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const formularz = document.getElementById('formularz-zgloszenia');
        const statusDiv = document.getElementById('status');
        const btnWyslij = document.getElementById('btn-wyslij');

        formularz.addEventListener('submit', async (e) => {
            e.preventDefault();

            const opisInput = document.getElementById('opis');
            const zdjecieInput = document.getElementById('zdjecieKotka');
            const plik = zdjecieInput.files[0];

            if (!plik) {
                alert('Proszę zrobić lub wybrać zdjęcie!');
                return;
            }

            btnWyslij.disabled = true;
            statusDiv.style.color = '#35636a';
            statusDiv.textContent = 'Pobieranie lokalizacji GPS...';

            const formData = new FormData();
            formData.append('opis', opisInput.value);
            formData.append('zdjecieKotka', plik);

            // Pobieramy geolokalizację z przeglądarki
            if ('geolocation' in navigator) {
                try {
                    const pozycja = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        });
                    });

                    formData.append('szerokosc', pozycja.coords.latitude);
                    formData.append('dlugosc', pozycja.coords.longitude);
                } catch (err) {
                    console.warn('GPS niedostępny lub odrzucony:', err.message);
                }
            }

            statusDiv.textContent = 'Wysyłanie zgłoszenia...';

            try {
                const odp = await fetch('/api/zgloszenie', {
                    method: 'POST',
                    body: formData
                });

                const wynik = await odp.json();

                if (wynik.sukces) {
                    statusDiv.style.color = '#27ae60';
                    statusDiv.textContent = '✅ Dziękujemy! Zgłoszenie zostało zapisane.';
                    formularz.reset();
                } else {
                    statusDiv.style.color = '#c1622d';
                    statusDiv.textContent = `❌ ${wynik.wiadomosc}`;
                }
            } catch (err) {
                statusDiv.style.color = '#c1622d';
                statusDiv.textContent = '❌ Błąd połączenia z serwerem.';
            } finally {
                btnWyslij.disabled = false;
            }
        });
    </script>
</body>
</html>
